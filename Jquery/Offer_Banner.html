<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Q4 - Special Offer Banner</title>
        <style>
            .banner{background:#fffbeb;padding:16px;margin:8px 0;border-radius:8px}
            .hidden{display:none}
            .container{max-width:900px;margin:0 auto}
        </style>
    </head>
    <body>
        <main class="container">
            <h1>Offers</h1>
            <div id="banners">
                <div class="banner" id="b1">Banner 1 — 20% off</div>
                <div class="banner" id="b2">Banner 2 — Free shipping</div>
                <div class="banner" id="b3">Banner 3 — Bundle deal</div>
                <div class="banner" id="b4">Banner 4 — New arrival</div>
                <div class="banner" id="b5">Banner 5 — Limited time</div>
            </div>
            <button id="hide">Hide</button>
            <button id="show">Show</button>
            <button id="slideUp">Slide Up</button>
            <button id="slideDown">Slide Down</button>
            <button id="fadeIn">Fade In</button>
            <button id="fadeOut">Fade Out</button>
        </main>
        <script src="Offer_Banner.js"></script>
    </body>    
</html>
