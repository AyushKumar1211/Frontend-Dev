<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Q3 - Interactive FAQ</title>
        <style>
            .faq{max-width:800px;margin:0 auto}
            .q{background:#fff;padding:12px;margin:8px 0;border-radius:8px}
            .answer{display:none;margin-top:8px}
            .active{color:teal}
            input[type=text]{width:100%;padding:8px;margin-top:8px}
        </style>
    </head>
    <body>
        <main class="faq">
            <h1>FAQ</h1>
            <section class="q">
                <h3 class="question" tabindex="0">What is the return policy?</h3>
                <div class="answer">You can return within 30 days.</div>
                <input type="text" placeholder="Add note">
            </section>
            <section class="q">
                <h3 class="question" tabindex="0">How long is shipping?</h3>
                <div class="answer">Shipping takes 3–7 days.</div>
                <input type="text" placeholder="Add note">
            </section>
            <section class="q">
                <h3 class="question" tabindex="0">Do you ship internationally?</h3>
                <div class="answer">Yes, to selected countries.</div>
                <input type="text" placeholder="Add note">
            </section>
            <section class="q">
                <h3 class="question" tabindex="0">How to contact support?</h3>
                <div class="answer">Use the contact form or chat.</div>
                <input type="text" placeholder="Add note">
            </section>
            <section class="q">
                <h3 class="question" tabindex="0">Are there gift cards?</h3>
                <div class="answer">Yes, digital gift cards available.</div>
                <input type="text" placeholder="Add note">
            </section>
        </main>
        <script src="Interactive_FAQ.js"></script>
    </body>
</html>
