<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi jQuery Widgets</title>

    <script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
    <script>
        var jq1 = jQuery.noConflict(true);
    </script>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        var jq2 = jQuery.noConflict(true);
    </script>

    <script src="multi_Jquery.js" defer></script>
</head>
<body>

<h2>Multi-jQuery Dashboard</h2>

<div id="carousel">
    <div class="slide">Slide 1</div>
    <div class="slide" style="display:none">Slide 2</div>
    <div class="slide" style="display:none">Slide 3</div>
</div>

<button id="openModal">Open Modal</button>

<div id="modal" style="display:none; padding:20px; border:1px solid black; width:200px; background:#eee;">
    Notification Popup
    <br><br>
    <button id="closeModal">Close</button>
</div>

<div id="widgets">
    <div class="widget" data-tip="This is widget A">Widget A</div>
    <div class="widget" data-tip="This is widget B">Widget B</div>
    <div class="widget" data-tip="This is widget C">Widget C</div>
</div>

</body>
</html>
