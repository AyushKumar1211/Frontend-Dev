<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Validation</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="Registration_validation.js" defer></script>
</head>
<body>

<h2>Registration Form</h2>

<form id="regForm">
    <input type="text" id="name" placeholder="Name">
    <br><br>
    <input type="email" id="email" placeholder="Email">
    <br><br>
    <input type="password" id="password" placeholder="Password">
    <br><br>
    <button type="button" id="submitBtn">Register</button>
</form>

<div id="success" style="display:none; margin-top:20px; font-weight:bold; color:green;"></div>

</body>
</html>
