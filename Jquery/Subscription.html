<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Subscription Panel</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="Subscription.js" defer></script>
</head>
<body>

    <h2>Subscription Management</h2>

    <button id="subscribeBtn">Subscribe</button>
    <button id="unsubscribeBtn">Unsubscribe</button>

    <h3>Add New Topic</h3>
    <input type="text" id="newTopicInput" placeholder="Enter topic name">
    <button id="addTopicBtn">Add Topic</button>

    <ul id="topicsList"></ul>

    <div id="message"></div>

</body>
</html>
