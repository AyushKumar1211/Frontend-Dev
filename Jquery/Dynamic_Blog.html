<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Blog Posts</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="Dynamic_Blog.js" defer></script>
</head>
<body>

    <h2>Blog Manager</h2>

    <button id="addPost">Add New Post</button>
    <button id="prependPost">Prepend Featured Post</button>
    <button id="removeLast">Remove Last Post</button>
    <button id="addTags">Add Tags To Posts</button>
    <input type="text" id="keyword" placeholder="Highlight keyword...">
    <button id="highlightBtn">Highlight</button>

    <ul id="postList">
        <li>Learning JavaScript effectively</li>
        <li>Importance of clean UI design</li>
        <li>Introduction to Machine Learning</li>
        <li>Top tools for Web Developers</li>
        <li>Managing time as a programmer</li>
    </ul>

</body>
</html>
