<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Team Members Directory</title>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="Team_Member.js" defer></script>
        <style>
            body { font-family: Arial; padding: 20px; }
            .department { margin-bottom: 30px; padding: 10px; border: 1px solid #ccc; }
            .manager { padding: 10px; background: #f2f2f2; cursor: pointer; }
            .employee { margin-left: 20px; padding: 5px; cursor: pointer; }
            .info { display: none; font-size: 14px; margin-left: 40px; color: #333; }
            button { margin-right: 10px; padding: 8px 12px; }
        </style>
    </head>
    <body>
        
        <main>
            
            <section class="department" data-dept="sales">
                <h2 class="dept-title">Sales Department</h2>
                
                <div class="manager">Manager A
                    <div class="employee">Employee 1
                        <div class="info">emp1@sales.com</div>
                    </div>
                    <div class="employee">Employee 2
                        <div class="info">emp2@sales.com</div>
                    </div>
                </div>
            </section>
            
            <section class="department" data-dept="tech">
                <h2 class="dept-title">Tech Department</h2>
                
                <div class="manager">Manager B
                    <div class="employee">Employee 3
                        <div class="info">emp3@tech.com</div>
                    </div>
                    <div class="employee">Employee 4
                        <div class="info">emp4@tech.com</div>
                    </div>
                </div>
            </section>
            
            <button id="random">Highlight Sibling Employees (Random)</button>
            <button id="toggleTeams">Collapse / Expand All Teams</button>
            
        </main>
        
    </body>
</html>
